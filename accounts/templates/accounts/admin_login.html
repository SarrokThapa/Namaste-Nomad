{% load static %}
<!-- FILE: accounts/templates/accounts/admin_login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Namaste Nomad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/admin_login.css">
    <link rel="stylesheet" href="{% static 'css/animations.css' %}">
    <link rel="stylesheet" href="{% static 'css/toast.css' %}">
</head>
<body class="admin-page">
    {% include "core/includes/messages_toast.html" %}
    <main class="admin-shell">
        <div class="admin-brand">
            <div class="brand-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 19l8-14 8 14H4z"/>
                </svg>
            </div>
            <h1>Namaste Nomad</h1>
        </div>

        <div class="admin-card">
            <h2>Admin Login</h2>


            <form method="POST" action="{% url 'admin_login' %}">
                {% csrf_token %}
                {% if request.GET.next or request.POST.next %}
                    <input type="hidden" name="next" value="{{ request.POST.next|default:request.GET.next }}">
                {% endif %}
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="password-input">
                        <input type="password" name="password" id="adminPassword" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('adminPassword', this)" aria-label="Show password" aria-pressed="false">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-primary btn-blue">Login</button>
            </form>

            <div class="admin-divider"></div>
            <div class="admin-notice">Admin access only</div>
        </div>
    </main>

        <script src="/static/js/main.js"></script>
        <script>
            if (window.history && window.history.pushState) {
                window.history.pushState(null, '', window.location.href);
                window.onpopstate = function () {
                    window.location.replace("{% url 'account_login_choice' %}");
                };
            }
        </script>
    <script src="{% static 'js/toast.js' %}"></script>
    <script src="{% static 'js/animations.js' %}"></script>
</body>
</html>
