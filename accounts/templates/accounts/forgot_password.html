{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Namaste Nomad</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="{% static 'css/animations.css' %}">
    <link rel="stylesheet" href="{% static 'css/toast.css' %}">
</head>
<body>
    {% include "core/includes/messages_toast.html" %}
    <nav class="navbar navbar-blue">
        <a class="nav-brand" href="{% url 'home' %}">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M4 19l8-14 8 14H4z"/>
            </svg>
            <span>Namaste Nomad</span>
        </a>
        <div class="nav-buttons">
            <a href="{% url 'account_login_choice' %}" class="btn-nav">Login</a>
            <a href="{% url 'account_register_choice' %}" class="btn-nav btn-nav-orange">Register</a>
        </div>
    </nav>

    <div class="container">
        <div class="auth-card">
            <div class="otp-icon">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="1.8">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
            </div>

            <h2>Forgot Password?</h2>
            <p class="subtitle">Enter your email address and we'll send you a reset code.</p>

            <form method="POST" action="{% url 'forgot_password' %}" id="forgotPasswordForm">
                {% csrf_token %}
                <div class="form-group">
                    <label for="resetEmail">Email Address</label>
                    <input
                        type="email"
                        id="resetEmail"
                        name="email"
                        placeholder="Enter your registered email"
                        required
                        autocomplete="email"
                    >
                </div>

                <button type="submit" class="btn-primary btn-blue" id="submitBtn">
                    Send Reset Code
                </button>
            </form>

            <div class="form-footer">
                <p>Remember your password? <a href="{% url 'account_login_choice' %}" class="link">Back to Login</a></p>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script src="{% static 'js/toast.js' %}"></script>
    <script src="{% static 'js/animations.js' %}"></script>
    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', function () {
            var btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Sending...';
        });
    </script>
</body>
</html>
