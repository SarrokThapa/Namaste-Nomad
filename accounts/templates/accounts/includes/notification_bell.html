{% if request.user.is_authenticated %}
<div class="notification-shell" data-notification>
    <button type="button" class="notification-bell" data-notification-toggle aria-expanded="false">
        <span class="notification-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 7h18s-3 0-3-7"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
        </span>
        <span class="notification-badge" data-notification-count {% if not notifications_unread_count %}hidden{% endif %}>
            {{ notifications_unread_count|default:0 }}
        </span>
    </button>
    <div class="notification-dropdown" data-notification-panel aria-hidden="true">
        <div class="notification-header">
            <span>Notifications</span>
            <button type="button" class="notification-mark" data-notification-mark-all>Mark all read</button>
        </div>
        <div class="notification-list" data-notification-list></div>
        <a class="notification-view-all" href="{% url 'notifications_list' %}">View All</a>
    </div>
</div>
{% endif %}
