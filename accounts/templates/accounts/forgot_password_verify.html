{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Reset Code - Namaste Nomad</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="{% static 'css/animations.css' %}">
    <link rel="stylesheet" href="{% static 'css/toast.css' %}">
    <style>
        .otp-digits {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 1rem 0;
        }
        .otp-digits input {
            width: 46px;
            height: 54px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: 700;
            border: 2px solid #CBD5E1;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            caret-color: transparent;
        }
        .otp-digits input:focus {
            border-color: #2563EB;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
        }
        .otp-digits.error input {
            border-color: #EF4444;
            animation: shake 0.4s ease;
        }
        .resend-row {
            text-align: center;
            font-size: 0.9rem;
            color: #6B7280;
            margin-top: 1rem;
        }
        .resend-row .link-button {
            color: #2563EB;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0;
        }
        .resend-row .link-button:disabled {
            color: #9CA3AF;
            cursor: default;
        }
        #resendTimer {
            font-weight: 600;
            color: #9CA3AF;
        }
        /* hidden OTP input that gets submitted */
        #otpHidden { display: none; }
    </style>
</head>
<body>
    {% include "core/includes/messages_toast.html" %}
    <nav class="navbar navbar-blue">
        <a class="nav-brand" href="{% url 'home' %}">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M4 19l8-14 8 14H4z"/>
            </svg>
            <span>Namaste Nomad</span>
        </a>
    </nav>

    <div class="container">
        <div class="auth-card">
            <div class="otp-icon">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="1.8">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                    <polyline points="22,6 12,13 2,6"/>
                </svg>
            </div>

            <h2>Enter Reset Code</h2>
            <p class="subtitle">Enter the 6-digit code sent to<br><strong>{{ masked_email }}</strong></p>

            <form method="POST" action="{% url 'forgot_password_verify' %}" id="verifyForm">
                {% csrf_token %}
                <input type="hidden" name="otp_code" id="otpHidden">

                <div class="otp-digits" id="otpDigits">
                    <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" autocomplete="off" aria-label="Digit 1">
                    <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" autocomplete="off" aria-label="Digit 2">
                    <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" autocomplete="off" aria-label="Digit 3">
                    <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" autocomplete="off" aria-label="Digit 4">
                    <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" autocomplete="off" aria-label="Digit 5">
                    <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" autocomplete="off" aria-label="Digit 6">
                </div>

                <button type="submit" class="btn-primary btn-blue" id="verifyBtn" disabled>Verify Code</button>
            </form>

            <div class="resend-row">
                <span>Didn't receive it? </span>
                <button id="resendBtn" class="link-button" disabled>Resend Code</button>
                <span id="resendTimer"></span>
            </div>

            <div class="form-footer" style="margin-top: 1rem;">
                <p><a href="{% url 'forgot_password' %}" class="link">Use a different email</a></p>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script src="{% static 'js/toast.js' %}"></script>
    <script src="{% static 'js/animations.js' %}"></script>
    <script>
    (function () {
        var digits = Array.from(document.querySelectorAll('#otpDigits input'));
        var hidden = document.getElementById('otpHidden');
        var form = document.getElementById('verifyForm');
        var verifyBtn = document.getElementById('verifyBtn');
        var resendBtn = document.getElementById('resendBtn');
        var timerEl = document.getElementById('resendTimer');
        var resendSecondsLeft = {{ resend_seconds }};

        // --- OTP digit input wiring ---
        digits.forEach(function (input, idx) {
            input.addEventListener('input', function () {
                // Only allow digits
                this.value = this.value.replace(/[^0-9]/g, '');
                if (this.value.length === 1 && idx < digits.length - 1) {
                    digits[idx + 1].focus();
                }
                syncHidden();
            });

            input.addEventListener('keydown', function (e) {
                if (e.key === 'Backspace' && !this.value && idx > 0) {
                    digits[idx - 1].focus();
                    digits[idx - 1].value = '';
                    syncHidden();
                }
            });

            input.addEventListener('paste', function (e) {
                e.preventDefault();
                var pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '').slice(0, 6);
                pasted.split('').forEach(function (ch, i) {
                    if (digits[i]) digits[i].value = ch;
                });
                var nextEmpty = digits.find(function (d) { return !d.value; });
                if (nextEmpty) nextEmpty.focus(); else digits[5].focus();
                syncHidden();
            });
        });

        function syncHidden() {
            var code = digits.map(function (d) { return d.value; }).join('');
            hidden.value = code;
            verifyBtn.disabled = code.length < 6;
        }

        // Auto-submit when all 6 digits are entered
        form.addEventListener('submit', function () {
            verifyBtn.disabled = true;
            verifyBtn.innerHTML = '<span class="spinner"></span> Verifying...';
        });

        // Focus first digit on load
        if (digits[0]) digits[0].focus();

        // --- Shake on error (server added error toast) ---
        var otpDigitsEl = document.getElementById('otpDigits');
        document.addEventListener('DOMContentLoaded', function () {
            var msgs = document.getElementById('django-messages-data');
            if (msgs) {
                try {
                    var data = JSON.parse(msgs.textContent || '[]');
                    if (data.some(function (m) { return m.level_tag === 'error'; })) {
                        otpDigitsEl.classList.add('error');
                        setTimeout(function () { otpDigitsEl.classList.remove('error'); }, 500);
                        digits.forEach(function (d) { d.value = ''; });
                        digits[0].focus();
                    }
                } catch (e) {}
            }
        });

        // --- Resend countdown timer ---
        function updateTimer() {
            if (resendSecondsLeft <= 0) {
                resendBtn.disabled = false;
                timerEl.textContent = '';
                return;
            }
            resendBtn.disabled = true;
            timerEl.textContent = ' (' + resendSecondsLeft + 's)';
            resendSecondsLeft--;
            setTimeout(updateTimer, 1000);
        }
        updateTimer();

        resendBtn.addEventListener('click', function () {
            if (resendBtn.disabled) return;
            resendBtn.disabled = true;
            timerEl.textContent = ' (sending...)';

            var csrfInput = form.querySelector('[name=csrfmiddlewaretoken]');
            var csrf = csrfInput ? csrfInput.value : '';

            fetch('{% url "forgot_password_resend" %}', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrf,
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: '',
            }).then(function (r) {
                // Full redirect handled server-side; just reload to get fresh cooldown
                window.location.reload();
            }).catch(function () {
                window.location.reload();
            });
        });
    }());
    </script>
</body>
</html>
