{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Namaste Nomad</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="{% static 'css/animations.css' %}">
    <link rel="stylesheet" href="{% static 'css/toast.css' %}">
    <style>
        .strength-bar-wrap {
            margin-top: 8px;
            height: 5px;
            background: #E5E7EB;
            border-radius: 99px;
            overflow: hidden;
        }
        .strength-bar {
            height: 100%;
            width: 0;
            border-radius: 99px;
            transition: width 0.3s ease, background-color 0.3s ease;
        }
        .strength-label {
            font-size: 0.78rem;
            font-weight: 600;
            margin-top: 4px;
            min-height: 1.2em;
        }
        .strength-weak   { color: #EF4444; }
        .strength-medium { color: #F59E0B; }
        .strength-strong { color: #16A34A; }

        .match-indicator {
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 4px;
            min-height: 1.2em;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .match-ok   { color: #16A34A; }
        .match-fail { color: #EF4444; }

        .req-list {
            font-size: 0.8rem;
            color: #6B7280;
            margin: 8px 0 0;
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .req-list li { display: flex; align-items: center; gap: 6px; }
        .req-list li.ok  { color: #16A34A; }
        .req-list li.ok::before  { content: '✓'; font-weight: 700; }
        .req-list li:not(.ok)::before { content: '○'; color: #CBD5E1; }
    </style>
</head>
<body>
    {% include "core/includes/messages_toast.html" %}
    <nav class="navbar navbar-blue">
        <a class="nav-brand" href="{% url 'home' %}">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M4 19l8-14 8 14H4z"/>
            </svg>
            <span>Namaste Nomad</span>
        </a>
    </nav>

    <div class="container">
        <div class="auth-card">
            <div class="otp-icon">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="1.8">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
            </div>

            <h2>Set New Password</h2>
            <p class="subtitle">Choose a strong password for your account.</p>

            <form method="POST" action="{% url 'forgot_password_new_password' %}" id="newPasswordForm">
                {% csrf_token %}

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div class="password-input">
                        <input
                            type="password"
                            id="newPassword"
                            name="password"
                            placeholder="Enter new password"
                            required
                            autocomplete="new-password"
                        >
                        <button type="button" class="toggle-password" onclick="togglePassword('newPassword', this)" aria-label="Show password" aria-pressed="false">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <div class="strength-bar-wrap">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <div class="strength-label" id="strengthLabel"></div>
                    <ul class="req-list" id="reqList">
                        <li id="req-len">At least 8 characters</li>
                        <li id="req-upper">Uppercase letter (A–Z)</li>
                        <li id="req-lower">Lowercase letter (a–z)</li>
                        <li id="req-num">Number (0–9)</li>
                    </ul>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <div class="password-input">
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirm_password"
                            placeholder="Re-enter new password"
                            required
                            autocomplete="new-password"
                        >
                        <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)" aria-label="Show password" aria-pressed="false">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <div class="match-indicator" id="matchIndicator"></div>
                </div>

                <button type="submit" class="btn-primary btn-blue" id="saveBtn">Reset Password</button>
            </form>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script src="{% static 'js/toast.js' %}"></script>
    <script src="{% static 'js/animations.js' %}"></script>
    <script>
    (function () {
        var pwInput   = document.getElementById('newPassword');
        var cfInput   = document.getElementById('confirmPassword');
        var bar       = document.getElementById('strengthBar');
        var label     = document.getElementById('strengthLabel');
        var matchEl   = document.getElementById('matchIndicator');
        var saveBtn   = document.getElementById('saveBtn');
        var reqLen    = document.getElementById('req-len');
        var reqUpper  = document.getElementById('req-upper');
        var reqLower  = document.getElementById('req-lower');
        var reqNum    = document.getElementById('req-num');

        function checkReqs(pw) {
            return {
                len:   pw.length >= 8,
                upper: /[A-Z]/.test(pw),
                lower: /[a-z]/.test(pw),
                num:   /[0-9]/.test(pw),
            };
        }

        function updateStrength() {
            var pw = pwInput.value;
            var r  = checkReqs(pw);

            reqLen.classList.toggle('ok',   r.len);
            reqUpper.classList.toggle('ok', r.upper);
            reqLower.classList.toggle('ok', r.lower);
            reqNum.classList.toggle('ok',   r.num);

            var score = [r.len, r.upper, r.lower, r.num].filter(Boolean).length;
            var hasSpecial = /[^A-Za-z0-9]/.test(pw);
            if (hasSpecial && pw.length >= 8) score = Math.min(score + 1, 5);

            if (!pw) {
                bar.style.width = '0';
                bar.style.backgroundColor = '';
                label.textContent = '';
                label.className = 'strength-label';
            } else if (pw.length < 6 || score <= 1) {
                bar.style.width = '25%';
                bar.style.backgroundColor = '#EF4444';
                label.textContent = 'Weak';
                label.className = 'strength-label strength-weak';
            } else if (score <= 3) {
                bar.style.width = '55%';
                bar.style.backgroundColor = '#F59E0B';
                label.textContent = 'Medium';
                label.className = 'strength-label strength-medium';
            } else {
                bar.style.width = '100%';
                bar.style.backgroundColor = '#16A34A';
                label.textContent = 'Strong';
                label.className = 'strength-label strength-strong';
            }

            updateMatch();
        }

        function updateMatch() {
            var pw = pwInput.value;
            var cf = cfInput.value;
            if (!cf) {
                matchEl.textContent = '';
                matchEl.className = 'match-indicator';
                return;
            }
            if (pw === cf) {
                matchEl.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg> Passwords match';
                matchEl.className = 'match-indicator match-ok';
            } else {
                matchEl.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Passwords do not match';
                matchEl.className = 'match-indicator match-fail';
            }
        }

        pwInput.addEventListener('input', updateStrength);
        cfInput.addEventListener('input', updateMatch);

        document.getElementById('newPasswordForm').addEventListener('submit', function () {
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<span class="spinner"></span> Saving...';
        });
    }());
    </script>
</body>
</html>
